# Render blueprint: one repo, two services.
#   backend  - FastAPI (LangGraph workflow, three datastores)      -> https://<name>-api.onrender.com
#   frontend - static Vite build that talks to the backend          -> https://<name>.onrender.com
# Secrets are NOT in this file: set them in the Render dashboard (Environment) for the backend service.
services:
  - type: web
    name: cardio4cities-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from app.embeddings import embed_one; embed_one('warm the model cache')"
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: ollama
      - key: SEARCH_PROVIDER
        value: auto
      - key: RESEARCH_CACHE_TTL_HOURS
        value: "0"
      - key: MAX_DOCUMENTS_PER_RUN
        value: "20"
      # set in dashboard (sync: false = never stored in the repo):
      - { key: SERPER_API_KEY_1, sync: false }
      - { key: SERPER_API_KEY_2, sync: false }
      - { key: OLLAMA_API_KEY_1, sync: false }
      - { key: OLLAMA_API_KEY_2, sync: false }
      - { key: OLLAMA_API_KEY_3, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }        # Neon Postgres
      - { key: QDRANT_URL, sync: false }          # Qdrant Cloud
      - { key: QDRANT_API_KEY, sync: false }
      - { key: NEO4J_URI, sync: false }           # Neo4j Aura
      - { key: NEO4J_USERNAME, sync: false }
      - { key: NEO4J_PASSWORD, sync: false }
      - { key: NEO4J_DATABASE, sync: false }

  - type: web
    name: cardio4cities
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cardio4cities-api.onrender.com
