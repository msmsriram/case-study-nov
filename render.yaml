# Render blueprint: ONE service, ONE URL. FastAPI serves the API and the prebuilt React UI
# (backend/frontend_dist, produced by `npm run build:deploy` in frontend/).
# Secrets are NOT in this file: Render asks for them when the blueprint is applied.
services:
  - type: web
    name: cardio4cities
    runtime: python
    plan: standard        # 2 GB RAM. The API idles at ~460 MB, so 512 MB instances get OOM-killed mid-run
    region: ohio          # next to the Neon database (us-east-2)
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from app.embeddings import embed_one; embed_one('warm the model cache')"
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3        # the version everything was tested on
      - key: LLM_PROVIDER
        value: ollama
      - key: SEARCH_PROVIDER
        value: auto
      - key: RESEARCH_CACHE_TTL_HOURS
        value: "0"           # always research live
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/backend/.fastembed
      - { key: SERPER_API_KEY_1, sync: false }
      - { key: SERPER_API_KEY_2, sync: false }
      - { key: SERPER_API_KEY_3, sync: false }
      - { key: SERPER_API_KEY_4, sync: false }
      - { key: OLLAMA_API_KEY_1, sync: false }
      - { key: OLLAMA_API_KEY_2, sync: false }
      - { key: OLLAMA_API_KEY_3, sync: false }
      - { key: OLLAMA_API_KEY_4, sync: false }
      - { key: OLLAMA_API_KEY_5, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }        # Neon Postgres
      - { key: QDRANT_URL, sync: false }          # Qdrant Cloud
      - { key: QDRANT_API_KEY, sync: false }
      - { key: NEO4J_URI, sync: false }           # Neo4j Aura
      - { key: NEO4J_USERNAME, sync: false }
      - { key: NEO4J_PASSWORD, sync: false }
      - { key: NEO4J_DATABASE, sync: false }
